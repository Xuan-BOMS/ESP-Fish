<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP Fish · 动画水族馆</title>
<style>
:root{color-scheme:dark;--bg:#081429;--card:#10233b;--line:#29415b;--ink:#edf7fa;--muted:#9eb5c6;--accent:#ffce79;--water:#7dd9e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px 'Microsoft YaHei','PingFang SC',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.4;cursor:not-allowed}header{border-bottom:1px solid var(--line);padding:24px 5vw;display:flex;justify-content:space-between;align-items:center}.brand{font:italic 30px Georgia,serif;letter-spacing:-1px}.tag{color:var(--water);font-size:12px;letter-spacing:2px}main{max-width:1500px;margin:auto;padding:40px 5vw 150px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:45px}h1{font-size:34px;font-weight:500;margin:0 0 12px}h2{font-size:17px;font-weight:500;margin:0 0 16px}p{color:var(--muted);line-height:1.8;margin:10px 0 24px}aside section{border-top:1px solid var(--line);padding:24px 0}aside section:first-child{border:0;padding-top:0}.mode{display:block;width:100%;padding:17px;text-align:left;background:transparent;border:1px solid var(--line);color:var(--ink);margin-bottom:8px;border-radius:8px}.mode[aria-pressed=true]{border-color:var(--water);background:#123447;color:var(--water)}label.axis{display:block;margin:16px 0;color:var(--muted);font-size:13px}input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px;vertical-align:middle}.subtle{padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}#status{font-size:13px;min-height:42px}.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--water);margin-right:9px}#device{font:12px/2 'Microsoft YaHei',sans-serif;white-space:pre-wrap;color:var(--muted)}.intro{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.number{font:64px/1 Georgia,serif;color:var(--water)}.number small{display:block;font:11px/3 'Microsoft YaHei',sans-serif;color:var(--muted);text-align:center;letter-spacing:2px}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);padding:24px 0}#search{background:#10233b;border:1px solid var(--line);border-radius:6px;padding:11px 15px;color:var(--ink);min-width:160px;flex:1}.filter{border:0;background:transparent;color:var(--muted);padding:10px}.filter[aria-pressed=true]{color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:15px}.clip{border:1px solid var(--line);border-radius:9px;background:var(--card);overflow:hidden;transition:border-color .15s,transform .15s}.clip:hover{transform:translateY(-3px);border-color:var(--water)}.clip.selected{border-color:var(--accent)}.preview{display:block;border:0;padding:0;width:100%;position:relative;background:var(--bg);color:var(--ink)}.preview img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.play{position:absolute;right:12px;bottom:12px;background:#162f48e8;border-radius:30px;padding:7px 11px;font-size:11px}.choose{padding:14px 12px;display:flex;gap:9px;align-items:flex-start;cursor:pointer}.choose input{flex-shrink:0}.clip-name{font-size:12px;line-height:1.6;overflow-wrap:anywhere}.meta{display:block;font-size:10px;color:var(--muted);margin-top:6px}footer{position:fixed;bottom:0;left:0;right:0;padding:18px 5vw;background:#0c2037f5;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;gap:22px;align-items:center;z-index:2}.capacity{flex:1;min-width:100px}.capacity label{font-size:13px}.capacity small{display:block;font-size:11px;color:var(--muted);margin-top:5px}progress{display:block;width:100%;height:5px;margin-top:10px;accent-color:var(--accent)}#apply{padding:15px 25px;border:0;border-radius:7px;background:var(--accent);color:var(--bg);font-weight:600}#feedback{font-size:12px;color:var(--accent);max-width:320px}dialog{max-width:560px;width:90vw;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:22px}dialog::backdrop{background:#000b}dialog video{width:100%;aspect-ratio:16/9;background:var(--bg)}dialog .subtle{float:right}#empty{color:var(--muted);padding:40px 0}a{color:var(--water)}@media(max-width:800px){main{grid-template-columns:1fr;gap:25px;padding-top:24px}aside{display:grid;grid-template-columns:1fr 1fr;gap:20px}aside section{padding-top:0;border:0}aside section:last-child{grid-column:1/-1}#device{display:inline}header{padding:18px 5vw}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:27px}.number{font-size:46px}footer{gap:12px;flex-wrap:wrap}#feedback{order:-1;max-width:100%;width:100%}#feedback:empty{display:none}#apply{padding:14px 16px}}
</style>
<header><span class="brand">ESP Fish<span style="color:var(--accent)">.</span></span><span class="tag">动画水族馆 / LIBRARY</span></header>
<main>
<aside>
<section><h2><span class="led"></span>桌面显示</h2><button class="mode" data-mode="balance" aria-pressed="false">01 / 余额与图像</button><button class="mode" data-mode="pet" aria-pressed="false">02 / 自由桌宠</button><p id="status" role="status">正在连接设备…</p></section>
<section><h2>倾斜与移动</h2><p style="font-size:12px">保持设备静止，设置当前姿态为参考。小鱼会自由活动，也会随倾斜移动。</p><button class="subtle" id="calibrate">校准当前姿态</button><label class="axis"><input type="checkbox" id="swap_axes"> 交换横向与纵向</label><label class="axis"><input type="checkbox" id="invert_x"> 反转横向</label><label class="axis"><input type="checkbox" id="invert_y"> 反转纵向</label></section>
<section><h2>设备状态</h2><pre id="device">等待设备连接</pre><a href="https://github.com/Xuan-BOMS/ESP-Fish" target="_blank" rel="noreferrer" style="font-size:11px">项目与使用说明 ↗</a></section>
</aside>
<div><div class="intro"><div><h1>挑几段，带在身边。</h1><p>动画收藏在香橙派。选好后发送到小鱼，<br>下载完成，即使断网也能继续播放。</p></div><div class="number"><span id="count">—</span><small>段动画收藏</small></div></div>
<div class="tools"><input id="search" type="search" placeholder="搜索动作名称…" aria-label="搜索动作名称"><button class="filter" id="selectedOnly" aria-pressed="false">只看已选</button><button class="subtle" id="clear">清空选择</button><button class="subtle" id="reset">恢复已保存</button></div>
<div class="grid" id="library"></div><p id="empty" hidden>没有匹配的动画。</p></div>
</main>
<footer><div class="capacity"><label id="usage">正在读取动画库…</label><progress id="meter" max="1" value="0"></progress><small id="sync">等待设备同步</small></div><span id="feedback" role="status" aria-live="polite"></span><button id="apply" disabled>发送到 ESP32</button></footer>
<dialog id="preview"><button class="subtle" id="closePreview" aria-label="关闭预览">关闭 ✕</button><h2 id="previewName"></h2><video id="video" controls loop playsinline></video><p style="font-size:12px">原始动画预览；设备播放 168 × 168、6 帧/秒版本。</p></dialog>
<script>
const $=s=>document.querySelector(s),axes=['swap_axes','invert_x','invert_y'];
let catalog=null,selected=new Set(),saved=[],busy=false,onlySelected=false,lastState=null,notice='';
const kb=n=>(n/1024).toFixed(0)+' KB';
async function request(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data;}
function updateUsage(){if(!catalog)return;const bytes=catalog.clips.filter(c=>selected.has(c.id)).reduce((a,c)=>a+c.bytes,0);$('#usage').textContent=`已选 ${selected.size} 段 · ${kb(bytes)} / ${kb(catalog.capacity)}`;$('#meter').max=catalog.capacity;$('#meter').value=bytes;const valid=selected.size>0&&selected.size<=catalog.max_clips&&bytes<=catalog.capacity;$('#apply').disabled=busy||!valid;$('#meter').style.accentColor=bytes>catalog.capacity?'#ff8279':'var(--accent)';$('#feedback').textContent=bytes>catalog.capacity?'空间不足，请减少动画':selected.size>catalog.max_clips?`最多选择 ${catalog.max_clips} 段`:notice;}
function drawLibrary(){if(!catalog)return;const query=$('#search').value.trim().toLocaleLowerCase();const list=catalog.clips.filter(c=>(!onlySelected||selected.has(c.id))&&c.name.toLocaleLowerCase().includes(query));$('#library').replaceChildren();$('#empty').hidden=list.length>0;for(const c of list){const card=document.createElement('article');card.className='clip'+(selected.has(c.id)?' selected':'');const preview=document.createElement('button');preview.className='preview';preview.setAttribute('aria-label','预览 '+c.name);const img=document.createElement('img');img.src='/thumbs/'+c.id+'.jpg';img.loading='lazy';img.alt='';const play=document.createElement('span');play.className='play';play.textContent='▷ 预览';preview.append(img,play);preview.onclick=()=>{$('#previewName').textContent=c.name;$('#video').src='/media/'+c.id+'.webm';$('#preview').showModal();$('#video').play().catch(()=>{});};const label=document.createElement('label');label.className='choose';const check=document.createElement('input');check.type='checkbox';check.checked=selected.has(c.id);const name=document.createElement('span');name.className='clip-name';name.textContent=c.name;const meta=document.createElement('small');meta.className='meta';meta.textContent=kb(c.bytes)+' · '+(c.frames/c.fps).toFixed(1)+' 秒';name.append(meta);label.append(check,name);check.onchange=()=>{notice='';check.checked?selected.add(c.id):selected.delete(c.id);card.classList.toggle('selected',check.checked);updateUsage();if(onlySelected&&!check.checked)drawLibrary();};card.append(preview,label);$('#library').append(card);}updateUsage();}
function render(s){lastState=s;if(catalog&&JSON.stringify(saved)!==JSON.stringify(s.animations)){const pristine=selected.size===saved.length&&saved.every(id=>selected.has(id));saved=[...s.animations];if(pristine){selected=new Set(saved);drawLibrary();}}const d=s.device;$('#status').textContent=!s.online?'设备离线 · 选择将在连接后生效':d.mode===s.mode?'设备在线 · '+(d.mode==='pet'?'桌宠模式':'余额模式'):'设备在线 · 正在切换…';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===s.mode)));axes.forEach(k=>$('#'+k).checked=s[k]);$('#device').textContent=d?`可用内存  ${kb(d.heap)}\n绘图缓冲  ${kb(d.render_bytes)}\n本地动画  ${d.cached_clips||0} 段\n倾斜传感器  ${d.imu?'已连接':'待机或未检测到'}`:'等待设备连接';const synced=s.online&&d.library_revision===s.playlist.revision&&d.sync_status==='ready';$('#sync').textContent=!s.online?'设备离线，使用已缓存的动画':d.sync_status==='error'?'同步失败，将自动重试：'+d.sync_error:d.sync_status==='downloading'?`正在下载 ${kb(d.downloaded)} / ${kb(d.download_total)}，完成后恢复播放`:synced?'已同步 · 动画已保存在设备，可离线播放':'等待设备下载所选动画';}
async function save(body,path='/api/mode'){try{render(await request(path,body));}catch(e){$('#feedback').textContent='保存失败：'+e.message;}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>save({mode:b.dataset.mode}));axes.forEach(k=>$('#'+k).onchange=e=>save({[k]:e.target.checked}));$('#calibrate').onclick=()=>save({},'/api/calibrate');$('#search').oninput=drawLibrary;$('#selectedOnly').onclick=()=>{onlySelected=!onlySelected;$('#selectedOnly').setAttribute('aria-pressed',String(onlySelected));drawLibrary();};$('#clear').onclick=()=>{notice='';selected.clear();drawLibrary();};$('#reset').onclick=()=>{notice='';selected=new Set(saved);drawLibrary();};$('#apply').onclick=async()=>{busy=true;updateUsage();try{const s=await request('/api/playlist',{animations:[...selected]});saved=[...s.animations];render(s);notice='已保存，设备将自动下载';}catch(e){notice='保存失败：'+e.message;}finally{busy=false;$('#apply').disabled=false;updateUsage();}};$('#closePreview').onclick=()=>$('#preview').close();$('#preview').addEventListener('close',()=>{$('#video').pause();$('#video').removeAttribute('src');$('#video').load();});
async function poll(){try{render(await request('/api/state'));if(!catalog){catalog=await request('/api/library');saved=[...catalog.selected];selected=new Set(saved);$('#count').textContent=catalog.clips.length;drawLibrary();}}catch(e){$('#status').textContent='无法连接网关，稍后重试';}setTimeout(poll,1500);}poll();
</script>
</html>
